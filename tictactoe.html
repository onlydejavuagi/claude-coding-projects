<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: 3px;
      color: #e94560;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      min-height: 1.8rem;
      color: #a8dadc;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #a8dadc; }

    .cell.win {
      background: #0f3460;
      box-shadow: 0 0 18px rgba(233, 69, 96, 0.6);
    }

    #controls {
      margin-top: 1.8rem;
      display: flex;
      gap: 12px;
    }

    button {
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.85; transform: scale(1.04); }

    #resetBtn { background: #e94560; color: #fff; }

    #modeBtn { background: #457b9d; color: #fff; }

    #score {
      margin-top: 1.4rem;
      display: flex;
      gap: 2.5rem;
      font-size: 1rem;
      color: #aaa;
    }

    .score-box { text-align: center; }
    .score-box span { display: block; font-size: 1.8rem; font-weight: bold; color: #eee; }
  </style>
</head>
<body>

<h1>TIC TAC TOE</h1>
<div id="status">X's turn</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<div id="controls">
  <button id="resetBtn">New Game</button>
  <button id="modeBtn">vs CPU</button>
</div>

<div id="score">
  <div class="score-box">X <span id="xScore">0</span></div>
  <div class="score-box">Draws <span id="drawScore">0</span></div>
  <div class="score-box">O <span id="oScore">0</span></div>
</div>

<script>
  const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  let board, current, gameOver, vsCPU;
  let scores = { X: 0, O: 0, D: 0 };

  const cells = document.querySelectorAll('.cell');
  const status = document.getElementById('status');
  const resetBtn = document.getElementById('resetBtn');
  const modeBtn = document.getElementById('modeBtn');

  function init() {
    board = Array(9).fill('');
    current = 'X';
    gameOver = false;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
    status.textContent = "X's turn";
  }

  function checkWinner() {
    for (const [a, b, c] of WINS) {
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return { winner: board[a], line: [a, b, c] };
      }
    }
    if (board.every(v => v)) return { winner: 'draw' };
    return null;
  }

  function applyMove(i) {
    board[i] = current;
    cells[i].textContent = current;
    cells[i].classList.add('taken', current.toLowerCase());

    const result = checkWinner();
    if (result) {
      gameOver = true;
      if (result.winner === 'draw') {
        status.textContent = "It's a draw!";
        scores.D++;
        document.getElementById('drawScore').textContent = scores.D;
      } else {
        status.textContent = `${result.winner} wins!`;
        result.line.forEach(idx => cells[idx].classList.add('win'));
        scores[result.winner]++;
        document.getElementById('xScore').textContent = scores.X;
        document.getElementById('oScore').textContent = scores.O;
      }
      return;
    }

    current = current === 'X' ? 'O' : 'X';
    status.textContent = `${current}'s turn`;

    if (vsCPU && current === 'O' && !gameOver) {
      setTimeout(cpuMove, 380);
    }
  }

  function cpuMove() {
    const move = bestMove();
    applyMove(move);
  }

  function minimax(b, isMax) {
    const r = checkWinnerFor(b);
    if (r === 'O') return 10;
    if (r === 'X') return -10;
    if (b.every(v => v)) return 0;

    if (isMax) {
      let best = -Infinity;
      b.forEach((v, i) => {
        if (!v) {
          b[i] = 'O';
          best = Math.max(best, minimax(b, false));
          b[i] = '';
        }
      });
      return best;
    } else {
      let best = Infinity;
      b.forEach((v, i) => {
        if (!v) {
          b[i] = 'X';
          best = Math.min(best, minimax(b, true));
          b[i] = '';
        }
      });
      return best;
    }
  }

  function checkWinnerFor(b) {
    for (const [a, bv, c] of WINS) {
      if (b[a] && b[a] === b[bv] && b[a] === b[c]) return b[a];
    }
    return null;
  }

  function bestMove() {
    let best = -Infinity, move = -1;
    board.forEach((v, i) => {
      if (!v) {
        board[i] = 'O';
        const score = minimax(board, false);
        board[i] = '';
        if (score > best) { best = score; move = i; }
      }
    });
    return move;
  }

  cells.forEach(cell => {
    cell.addEventListener('click', () => {
      const i = +cell.dataset.i;
      if (gameOver || board[i] || (vsCPU && current === 'O')) return;
      applyMove(i);
    });
  });

  resetBtn.addEventListener('click', init);

  modeBtn.addEventListener('click', () => {
    vsCPU = !vsCPU;
    modeBtn.textContent = vsCPU ? 'vs Human' : 'vs CPU';
    init();
  });

  vsCPU = false;
  init();
</script>
</body>
</html>
