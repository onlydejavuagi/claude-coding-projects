<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daybook</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f3460'/><path d='M10 9h12M10 16h12M10 23h7' stroke='%23a8dadc' stroke-width='3' stroke-linecap='round'/></svg>" />
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface-2: #1c2a4d;
      --card: #0f3460;
      --accent: #e94560;
      --teal: #a8dadc;
      --text: #e8e8f0;
      --text-soft: #c9cee0;
      --muted: #8b93b0;
      --line: #ffffff14;
      --radius: 14px;
      --shadow: 0 6px 24px #00000040;

      --mood-1: #e94560;
      --mood-2: #f4a261;
      --mood-3: #e9c46a;
      --mood-4: #a8dadc;
      --mood-5: #7bd389;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 80% -10%, #0f346055, transparent 60%),
        radial-gradient(900px 500px at -10% 110%, #e9456014, transparent 60%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: #e9456055; }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 24px;
      background: #16213ecc;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: 0.3px; }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 8px;
      display: grid; place-items: center;
      background: var(--card); color: var(--teal); font-size: 15px;
    }
    .nav { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 999px; border: 1px solid var(--line); }
    .nav a {
      padding: 6px 16px;
      border-radius: 999px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.92rem;
      transition: background 0.2s, color 0.2s;
    }
    .nav a:hover { color: var(--text); }
    .nav a.active { background: var(--card); color: var(--text); }

    /* ---------- Layout ---------- */
    .view {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 96px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeUp 0.35s ease both;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .page-head h1 { font-size: 1.75rem; font-weight: 650; letter-spacing: -0.3px; }
    .page-head p { color: var(--muted); margin-top: 2px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
    }

    ul { list-style: none; }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 40px 16px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }
    .empty strong { display: block; color: var(--text-soft); font-weight: 600; margin-bottom: 4px; }

    /* ---------- Controls ---------- */
    input, textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder, textarea::placeholder { color: #6b7391; }
    input:focus, textarea:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px #a8dadc22; }
    input[type='date'] { width: auto; padding: 6px 10px; color-scheme: dark; font-size: 0.85rem; }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 18px;
      font: inherit;
      font-weight: 550;
      cursor: pointer;
      transition: filter 0.15s, background 0.15s, transform 0.1s;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.97); }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    button:disabled { opacity: 0.4; cursor: default; filter: none; transform: none; }

    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
    button.ghost:hover { color: var(--text); border-color: #ffffff30; }

    button.icon {
      background: transparent; color: var(--muted);
      width: 32px; height: 32px; padding: 0; border-radius: 8px;
      display: inline-grid; place-items: center; font-weight: 400;
    }
    button.icon:hover { background: var(--surface-2); color: var(--text); }
    button.icon.danger:hover { color: var(--accent); }

    button.link { background: none; color: var(--teal); padding: 0; font-weight: 500; font-size: 0.85rem; }

    .chip {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .chip.active { background: var(--card); color: var(--text); border-color: transparent; }

    .kbd { font-size: 0.75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }

    /* ---------- Journal: insights ---------- */
    .insights { display: grid; grid-template-columns: repeat(3, 1fr) 1.6fr; gap: 12px; }
    .stat { padding: 14px 16px; }
    .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }
    .stat-value { font-size: 1.5rem; font-weight: 650; margin-top: 2px; display: flex; align-items: baseline; gap: 6px; }
    .stat-value small { font-size: 0.8rem; font-weight: 500; color: var(--muted); }

    .trend { padding: 14px 16px; display: flex; flex-direction: column; }
    .trend-bars { flex: 1; display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; min-height: 44px; margin-top: 8px; }
    .trend-bar { border-radius: 4px 4px 2px 2px; min-height: 4px; background: var(--line); transition: height 0.4s ease; }
    .trend-foot { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); margin-top: 6px; }

    /* ---------- Journal: composer ---------- */
    .composer { display: flex; flex-direction: column; gap: 16px; padding: 20px; box-shadow: var(--shadow); }
    .composer.editing { border-color: #a8dadc55; }
    .composer-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .composer-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--teal); font-weight: 600; }

    .title-input {
      background: transparent; border: none; border-radius: 0; padding: 0 0 6px;
      font-size: 1.25rem; font-weight: 600; border-bottom: 1px solid var(--line);
    }
    .title-input:focus { box-shadow: none; border-color: var(--teal); }

    .field { display: flex; flex-direction: column; gap: 8px; }
    .field-label { font-size: 0.82rem; color: var(--muted); font-weight: 500; }
    .field-row { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: start; }

    .moods { display: flex; gap: 8px; flex-wrap: wrap; }
    .mood-btn {
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 12px;
      padding: 8px 10px;
      min-width: 64px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 0.75rem; font-weight: 500;
    }
    .mood-btn .emoji { font-size: 1.35rem; line-height: 1.2; filter: grayscale(0.6); transition: filter 0.15s, transform 0.15s; }
    .mood-btn:hover .emoji { filter: none; transform: scale(1.1); }
    .mood-btn.selected { border-color: var(--c); color: var(--text); background: color-mix(in srgb, var(--c) 14%, var(--bg)); }
    .mood-btn.selected .emoji { filter: none; }

    .energy { display: flex; gap: 5px; align-items: flex-end; height: 52px; padding-bottom: 2px; }
    .energy-btn {
      width: 14px; padding: 0; border-radius: 4px;
      background: var(--bg); border: 1px solid var(--line);
    }
    .energy-btn.on { background: var(--teal); border-color: var(--teal); }
    .energy-val { font-size: 0.75rem; color: var(--muted); margin-left: 8px; align-self: center; min-width: 52px; }

    .body-input { min-height: 140px; resize: none; overflow: hidden; line-height: 1.65; }

    .tag-input {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px;
    }
    .tag-input:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px #a8dadc22; }
    .tag-input input { flex: 1; min-width: 120px; border: none; padding: 4px; background: transparent; }
    .tag-input input:focus { box-shadow: none; }
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: #a8dadc1a; color: var(--teal);
      border: none; border-radius: 999px; padding: 2px 10px;
      font-size: 0.8rem; font-weight: 500;
    }
    .tag button { background: none; color: inherit; padding: 0 0 0 2px; font-size: 0.8rem; opacity: 0.7; }
    .tag button:hover { opacity: 1; }

    .composer-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .composer-meta { font-size: 0.8rem; color: var(--muted); display: flex; gap: 10px; align-items: center; }
    .saved-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mood-5); display: inline-block; margin-right: 4px; opacity: 0; transition: opacity 0.3s; }
    .saved-dot.show { opacity: 1; }
    .composer-actions { display: flex; gap: 8px; }

    /* ---------- Journal: filters + list ---------- */
    .filterbar { display: flex; flex-direction: column; gap: 10px; }
    .search { position: relative; }
    .search input { padding-left: 36px; }
    .search::before { content: '⌕'; position: absolute; left: 12px; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 1.1rem; }
    .filter-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .filter-row .spacer { flex: 1; }
    .result-count { font-size: 0.82rem; color: var(--muted); }

    .month { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 12px 0 2px; font-weight: 600; }
    .entries { display: flex; flex-direction: column; gap: 12px; }

    .entry {
      display: grid; grid-template-columns: auto 1fr; gap: 14px;
      position: relative; overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
      animation: fadeUp 0.3s ease both;
    }
    .entry::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--c, var(--line)); }
    .entry:hover { border-color: #ffffff26; }
    .entry-mood {
      width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center; font-size: 1.4rem;
      background: color-mix(in srgb, var(--c, #8b93b0) 14%, transparent);
    }
    .entry-main { min-width: 0; }
    .entry-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .entry-head h3 { font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; }
    .entry-actions { display: flex; gap: 2px; opacity: 0.5; transition: opacity 0.15s; flex-shrink: 0; margin: -4px -6px 0 0; }
    .entry:hover .entry-actions, .entry:focus-within .entry-actions { opacity: 1; }
    .entry-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.8rem; color: var(--muted); margin-top: 1px; }
    .entry-meta .mood-name { color: var(--c); font-weight: 500; }
    .energy-mini { display: inline-flex; gap: 2px; align-items: flex-end; vertical-align: middle; margin-left: 4px; }
    .energy-mini i { width: 4px; border-radius: 1px; background: #ffffff22; }
    .energy-mini i.on { background: var(--teal); }

    .entry-body { margin-top: 10px; white-space: pre-wrap; color: var(--text-soft); overflow-wrap: anywhere; }
    .entry-body.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .entry-gratitude {
      margin-top: 10px; padding: 8px 12px; border-radius: 10px;
      background: #7bd38912; color: var(--text-soft); font-size: 0.9rem;
    }
    .entry-gratitude span { color: var(--mood-5); font-weight: 600; margin-right: 6px; }
    .entry-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .entry-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .entry-tags .tag { cursor: pointer; }
    .entry-tags .tag:hover { background: #a8dadc33; }

    /* ---------- To-Do ---------- */
    .todo-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    button.stat {
      text-align: left; font-weight: 400; color: var(--text);
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px;
    }
    button.stat:hover { filter: none; border-color: #ffffff30; }
    button.stat.active { border-color: var(--teal); box-shadow: 0 0 0 3px #a8dadc22; }
    .stat.warn .stat-value { color: #ff7b93; }
    .stat.soon .stat-value { color: var(--mood-3); }
    .stat.good .stat-value { color: var(--mood-5); }

    .add-task { display: flex; flex-direction: column; gap: 12px; padding: 14px; box-shadow: var(--shadow); }
    .add-main { display: flex; gap: 10px; }
    .add-main button { white-space: nowrap; }
    .task-opts { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
    .opt { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); flex-wrap: wrap; }
    .opt-label { margin-right: 2px; }
    .prio-picker { display: flex; gap: 4px; }
    .prio-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--bg); border: 1px solid var(--line); color: var(--muted);
      padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 500;
    }
    .prio-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--p); }
    .prio-btn.selected { color: var(--text); border-color: var(--p); background: color-mix(in srgb, var(--p) 16%, var(--bg)); }
    .task-opts .chip { padding: 3px 10px; font-size: 0.78rem; }
    .task-opts .tag-input { flex: 1; min-width: 180px; padding: 3px 8px; }
    .task-opts .tag-input input { padding: 3px; min-width: 80px; font-size: 0.85rem; }

    .todo-filters { display: flex; flex-direction: column; gap: 10px; }
    .filter-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .filter-top .search { flex: 1; min-width: 200px; }
    select {
      background: var(--bg); color: var(--text); color-scheme: dark;
      border: 1px solid var(--line); border-radius: 10px;
      padding: 9px 10px; font: inherit; font-size: 0.85rem; cursor: pointer;
    }
    select:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px #a8dadc22; }
    .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
    .seg button { background: transparent; color: var(--muted); padding: 5px 14px; font-size: 0.85rem; border-radius: 7px; font-weight: 500; }
    .seg button.active { background: var(--card); color: var(--text); }
    .n { font-size: 0.75rem; opacity: 0.7; margin-left: 5px; font-variant-numeric: tabular-nums; }
    .group-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-right: 2px; }
    .divider { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }
    .chip.prio.active { background: color-mix(in srgb, var(--p) 22%, transparent); }
    .chip.prio::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--p); margin-right: 6px; vertical-align: 1px; }

    .progress { display: flex; flex-direction: column; gap: 8px; }
    .progress-top { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); }
    .progress-track { height: 6px; border-radius: 999px; background: var(--surface); overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--mood-5)); border-radius: 999px; transition: width 0.4s ease; }

    .task-list { display: flex; flex-direction: column; gap: 8px; }
    .task {
      display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start;
      padding: 12px 10px 12px 16px; position: relative; overflow: hidden;
      animation: fadeUp 0.25s ease both;
      transition: border-color 0.2s, background 0.2s;
    }
    .task::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--p, transparent); }
    .task:hover { border-color: #ffffff26; }
    .task-check {
      appearance: none; flex-shrink: 0; margin-top: 1px;
      width: 22px; height: 22px; padding: 0; border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--p, #ffffff) 55%, transparent); background: transparent; cursor: pointer;
      display: grid; place-items: center; transition: background 0.15s, border-color 0.15s;
    }
    .task-check:hover { background: color-mix(in srgb, var(--p, #ffffff) 14%, transparent); }
    .task-check:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; box-shadow: none; }
    .task-check::after { content: '✓'; color: var(--bg); font-size: 13px; font-weight: 800; transform: scale(0); transition: transform 0.15s; }
    .task-check:checked { background: var(--mood-5); border-color: var(--mood-5); }
    .task-check:checked::after { transform: scale(1); }
    .task-check:hover:not(:checked)::after { transform: scale(0.8); color: color-mix(in srgb, var(--p, #ffffff) 60%, transparent); }

    .task-body { min-width: 0; }
    .task-text { overflow-wrap: anywhere; line-height: 1.45; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.74rem; padding: 1px 9px; border-radius: 999px; font-weight: 500;
      background: #ffffff0d; color: var(--muted);
    }
    .badge.overdue { background: #e9456024; color: #ff7b93; }
    .badge.today { background: #e9c46a1f; color: var(--mood-3); }
    .badge.prio { color: var(--p); background: color-mix(in srgb, var(--p) 14%, transparent); }
    .task-meta .tag { cursor: pointer; font-size: 0.74rem; padding: 1px 9px; }
    .task-meta .tag:hover { background: #a8dadc33; }
    .task-actions { display: flex; gap: 2px; opacity: 0.45; transition: opacity 0.15s; }
    .task:hover .task-actions, .task:focus-within .task-actions { opacity: 1; }

    /* Completed tasks: flat, dashed, dimmed */
    .done-section { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .done-head { display: flex; justify-content: space-between; align-items: center; }
    .done-toggle {
      background: none; color: var(--muted); padding: 4px 2px;
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
    }
    .done-toggle:hover { color: var(--text); filter: none; }
    .caret { display: inline-block; margin-right: 6px; transition: transform 0.2s; }
    .done-section.collapsed .caret { transform: rotate(-90deg); }
    .done-section.collapsed .task-list { display: none; }

    .task.done {
      background: transparent;
      border: 1px dashed #ffffff1a;
      padding-top: 9px; padding-bottom: 9px;
    }
    .task.done::before { display: none; }
    .task.done .task-text { color: var(--muted); text-decoration: line-through; text-decoration-color: #ffffff4d; }
    .task.done .task-meta { opacity: 0.65; margin-top: 4px; }
    .task.done:hover { border-color: #ffffff30; background: #ffffff05; }
    .done-when { font-size: 0.74rem; color: var(--mood-5); opacity: 0.85; }

    /* Inline editor */
    .task.editing { grid-template-columns: 1fr; border-color: #a8dadc55; background: var(--surface); }
    .task.editing::before { display: none; }
    .task-editor { display: flex; flex-direction: column; gap: 10px; }
    .editor-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .editor-actions button { padding: 6px 14px; font-size: 0.85rem; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 50;
      transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      display: flex; align-items: center; gap: 14px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 12px 10px 16px; box-shadow: var(--shadow);
      font-size: 0.9rem; transition: opacity 0.2s, transform 0.2s;
      max-width: calc(100% - 32px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .toast button { padding: 5px 12px; font-size: 0.85rem; }

    /* ---------- Responsive ---------- */
    @media (max-width: 680px) {
      .topbar { padding: 10px 16px; }
      .brand-name { display: none; }
      .insights { grid-template-columns: repeat(3, 1fr); }
      .trend { grid-column: 1 / -1; }
      .field-row { grid-template-columns: 1fr; gap: 16px; }
      .mood-btn { min-width: 0; flex: 1; }
      .composer { padding: 16px; }
      .entry { grid-template-columns: 1fr; gap: 10px; }
      .entry-mood { width: 36px; height: 36px; font-size: 1.15rem; }
      .entry-actions { opacity: 1; }
      .todo-stats { grid-template-columns: repeat(2, 1fr); }
      .filter-top .search { order: -1; min-width: 100%; }
      .seg { flex: 1; }
      .seg button { flex: 1; padding: 5px 8px; }
      .divider { display: none; }
      .add-main button { padding: 9px 14px; }
      .task-actions { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">✎</span><span class="brand-name">Daybook</span></div>
    <nav class="nav" aria-label="Sections">
      <a href="#/journal" data-route="journal">Journal</a>
      <a href="#/todo" data-route="todo">To-Do</a>
    </nav>
  </header>
  <main id="app"></main>
  <div class="toast" role="status" aria-live="polite"><span class="toast-msg"></span></div>

  <script>
  (() => {
    // =====================================================================
    // Utilities
    // =====================================================================
    const memory = {};

    function load(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return memory[key] ?? fallback;
      }
    }

    function save(key, value) {
      memory[key] = value;
      try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* memory only */ }
    }

    function remove(key) {
      delete memory[key];
      try { localStorage.removeItem(key); } catch { /* ignore */ }
    }

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    const pad = (n) => String(n).padStart(2, '0');
    const dayKey = (d) => { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
    const countWords = (s) => (s.trim().match(/\S+/g) || []).length;

    function debounce(fn, ms) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    function autoGrow(el) {
      el.style.height = 'auto';
      el.style.height = Math.max(140, el.scrollHeight + 2) + 'px';
    }

    // Toast with optional Undo action
    const toastEl = document.querySelector('.toast');
    let toastTimer;
    function toast(message, undo) {
      toastEl.querySelector('.toast-msg').textContent = message;
      toastEl.querySelector('button')?.remove();
      if (undo) {
        const b = document.createElement('button');
        b.textContent = 'Undo';
        b.onclick = () => { undo(); hideToast(); };
        toastEl.append(b);
      }
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, undo ? 6000 : 2500);
    }
    function hideToast() { toastEl.classList.remove('show'); }

    // =====================================================================
    // Journal
    // =====================================================================
    const JOURNAL_KEY = 'daybook.journal';
    const DRAFT_KEY = 'daybook.draft';

    const MOODS = [
      { v: 1, emoji: '😣', label: 'Awful', color: 'var(--mood-1)' },
      { v: 2, emoji: '😕', label: 'Low',   color: 'var(--mood-2)' },
      { v: 3, emoji: '😐', label: 'Okay',  color: 'var(--mood-3)' },
      { v: 4, emoji: '🙂', label: 'Good',  color: 'var(--mood-4)' },
      { v: 5, emoji: '😄', label: 'Great', color: 'var(--mood-5)' },
    ];
    const ENERGY_LABELS = ['', 'Drained', 'Low', 'Steady', 'Good', 'Charged'];
    const moodOf = (v) => MOODS.find((m) => m.v === v);

    // Normalize entries saved by older versions (title/body/createdAt only)
    const normalize = (e) => ({
      id: e.id ?? uid(),
      title: e.title ?? '',
      body: e.body ?? '',
      mood: e.mood ?? null,
      energy: e.energy ?? null,
      gratitude: e.gratitude ?? '',
      tags: Array.isArray(e.tags) ? e.tags : [],
      createdAt: e.createdAt ?? Date.now(),
      updatedAt: e.updatedAt ?? null,
    });

    const fmtLong = (ts) => new Date(ts).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const fmtShort = (ts) => new Date(ts).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    const fmtTime = (ts) => new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    const fmtMonth = (ts) => new Date(ts).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

    function greeting() {
      const h = new Date().getHours();
      return h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    }

    function renderJournal(root) {
      let entries = load(JOURNAL_KEY, []).map(normalize).sort((a, b) => b.createdAt - a.createdAt);
      let editingId = null;
      const filters = { q: '', mood: null, tag: null };

      // Composer state not held by plain inputs
      const draft = { mood: null, energy: null, tags: [] };

      root.innerHTML = `
        <section class="view">
          <div class="page-head">
            <h1>${greeting()}</h1>
            <p>${fmtLong(Date.now())}</p>
          </div>

          <div class="insights"></div>

          <form class="card composer" novalidate>
            <div class="composer-head">
              <span class="composer-label">New entry</span>
              <input type="date" name="date" aria-label="Entry date" />
            </div>

            <input name="title" class="title-input" placeholder="Give today a title…" autocomplete="off" maxlength="120" />

            <div class="field-row">
              <div class="field">
                <span class="field-label" id="mood-label">How are you feeling?</span>
                <div class="moods" role="radiogroup" aria-labelledby="mood-label">
                  ${MOODS.map((m) => `
                    <button type="button" class="mood-btn" data-mood="${m.v}" style="--c:${m.color}" role="radio" aria-checked="false">
                      <span class="emoji">${m.emoji}</span>${m.label}
                    </button>`).join('')}
                </div>
              </div>
              <div class="field">
                <span class="field-label" id="energy-label">Energy</span>
                <div class="energy" role="radiogroup" aria-labelledby="energy-label">
                  ${[1, 2, 3, 4, 5].map((n) => `
                    <button type="button" class="energy-btn" data-energy="${n}" style="height:${12 + n * 8}px"
                      role="radio" aria-checked="false" aria-label="Energy ${n}: ${ENERGY_LABELS[n]}" title="${ENERGY_LABELS[n]}"></button>`).join('')}
                  <span class="energy-val">—</span>
                </div>
              </div>
            </div>

            <textarea name="body" class="body-input" placeholder="What happened today? What's on your mind?"></textarea>

            <div class="field">
              <label class="field-label" for="gratitude">Grateful for</label>
              <input id="gratitude" name="gratitude" placeholder="One small good thing…" autocomplete="off" maxlength="200" />
            </div>

            <div class="field">
              <label class="field-label" for="tag-entry">Tags</label>
              <div class="tag-input">
                <span class="tag-list"></span>
                <input id="tag-entry" placeholder="Add a tag and press Enter" autocomplete="off" maxlength="30" />
              </div>
            </div>

            <div class="composer-foot">
              <span class="composer-meta">
                <span class="words">0 words</span>
                <span class="draft-status"><i class="saved-dot"></i><span></span></span>
              </span>
              <div class="composer-actions">
                <button type="button" class="ghost" data-action="clear">Clear</button>
                <button type="submit" data-action="save">Save entry</button>
              </div>
            </div>
          </form>

          <div class="filterbar">
            <div class="search"><input type="search" placeholder="Search entries, tags, gratitude…" aria-label="Search entries" /></div>
            <div class="filter-row">
              <button class="chip active" data-fmood="">All moods</button>
              ${MOODS.map((m) => `<button class="chip" data-fmood="${m.v}" title="${m.label}">${m.emoji}</button>`).join('')}
              <span class="active-tag"></span>
              <span class="spacer"></span>
              <span class="result-count"></span>
            </div>
          </div>

          <div class="entries"></div>
        </section>
      `;

      const $ = (sel) => root.querySelector(sel);
      const form = $('form');
      const insightsEl = $('.insights');
      const listEl = $('.entries');
      const bodyEl = form.elements.body;
      const tagEntry = $('#tag-entry');
      const saveBtn = form.querySelector('[data-action="save"]');

      // ---------------- Composer ----------------
      function setMood(v) {
        draft.mood = v;
        form.querySelectorAll('.mood-btn').forEach((b) => {
          const on = Number(b.dataset.mood) === v;
          b.classList.toggle('selected', on);
          b.setAttribute('aria-checked', on);
        });
      }

      function setEnergy(v) {
        draft.energy = v;
        form.querySelectorAll('.energy-btn').forEach((b) => {
          const n = Number(b.dataset.energy);
          b.classList.toggle('on', v != null && n <= v);
          b.setAttribute('aria-checked', n === v);
        });
        $('.energy-val').textContent = v ? ENERGY_LABELS[v] : '—';
      }

      function drawTags() {
        const wrap = $('.tag-list');
        wrap.replaceChildren(...draft.tags.map((t) => {
          const s = document.createElement('span');
          s.className = 'tag';
          s.innerHTML = `#${esc(t)}<button type="button" aria-label="Remove tag ${esc(t)}">✕</button>`;
          s.querySelector('button').onclick = () => {
            draft.tags = draft.tags.filter((x) => x !== t);
            drawTags(); onComposerChange();
          };
          return s;
        }));
      }

      function addTag(raw) {
        const t = raw.trim().replace(/^#/, '').replace(/\s+/g, '-').toLowerCase();
        if (t && !draft.tags.includes(t)) draft.tags.push(t);
        drawTags();
      }

      function readComposer() {
        return {
          date: form.elements.date.value,
          title: form.elements.title.value.trim(),
          body: bodyEl.value,
          gratitude: form.elements.gratitude.value.trim(),
          mood: draft.mood,
          energy: draft.energy,
          tags: [...draft.tags],
        };
      }

      function fillComposer(d = {}) {
        form.elements.date.value = d.date || dayKey(Date.now());
        form.elements.title.value = d.title || '';
        bodyEl.value = d.body || '';
        form.elements.gratitude.value = d.gratitude || '';
        tagEntry.value = '';
        setMood(d.mood ?? null);
        setEnergy(d.energy ?? null);
        draft.tags = [...(d.tags || [])];
        drawTags();
        autoGrow(bodyEl);
        updateMeta();
      }

      const isComposerEmpty = (c) => !c.title && !c.body.trim() && !c.gratitude && !c.mood && !c.energy && !c.tags.length;

      function updateMeta(savedNote) {
        const words = countWords(bodyEl.value);
        $('.words').textContent = `${words} word${words === 1 ? '' : 's'}`;
        const dot = $('.saved-dot');
        const label = $('.draft-status span');
        if (savedNote) {
          dot.classList.add('show'); label.textContent = savedNote;
        } else if (!editingId && isComposerEmpty(readComposer())) {
          dot.classList.remove('show'); label.textContent = '';
        }
        saveBtn.disabled = !bodyEl.value.trim() && !form.elements.title.value.trim();
      }

      const persistDraft = debounce(() => {
        if (editingId) return; // drafts only for new entries
        const c = readComposer();
        if (isComposerEmpty(c)) { remove(DRAFT_KEY); updateMeta(); return; }
        save(DRAFT_KEY, c);
        updateMeta('Draft saved');
      }, 500);

      function onComposerChange() {
        updateMeta();
        persistDraft();
      }

      function enterEditMode(entry) {
        editingId = entry.id;
        form.classList.add('editing');
        $('.composer-label').textContent = 'Editing entry';
        saveBtn.textContent = 'Update entry';
        form.querySelector('[data-action="clear"]').textContent = 'Cancel';
        fillComposer({ ...entry, date: dayKey(entry.createdAt) });
        updateMeta(`Last saved ${fmtShort(entry.updatedAt || entry.createdAt)}`);
        form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        bodyEl.focus({ preventScroll: true });
      }

      function exitEditMode() {
        editingId = null;
        form.classList.remove('editing');
        $('.composer-label').textContent = 'New entry';
        saveBtn.textContent = 'Save entry';
        form.querySelector('[data-action="clear"]').textContent = 'Clear';
        fillComposer(load(DRAFT_KEY, null) || {});
        if (load(DRAFT_KEY, null)) updateMeta('Draft restored');
      }

      form.addEventListener('click', (e) => {
        const moodBtn = e.target.closest('.mood-btn');
        if (moodBtn) {
          const v = Number(moodBtn.dataset.mood);
          setMood(draft.mood === v ? null : v); onComposerChange(); return;
        }
        const enBtn = e.target.closest('.energy-btn');
        if (enBtn) {
          const v = Number(enBtn.dataset.energy);
          setEnergy(draft.energy === v ? null : v); onComposerChange(); return;
        }
        if (e.target.closest('[data-action="clear"]')) {
          if (editingId) { exitEditMode(); return; }
          const prev = readComposer();
          if (isComposerEmpty(prev)) return;
          remove(DRAFT_KEY);
          fillComposer({});
          toast('Draft cleared', () => { fillComposer(prev); save(DRAFT_KEY, prev); updateMeta('Draft restored'); });
        }
      });

      form.addEventListener('input', (e) => {
        if (e.target === bodyEl) autoGrow(bodyEl);
        if (e.target !== tagEntry) onComposerChange();
      });

      tagEntry.addEventListener('keydown', (e) => {
        if ((e.key === 'Enter' || e.key === ',') && tagEntry.value.trim()) {
          e.preventDefault();
          addTag(tagEntry.value); tagEntry.value = ''; onComposerChange();
        } else if (e.key === 'Enter') {
          e.preventDefault();
        } else if (e.key === 'Backspace' && !tagEntry.value && draft.tags.length) {
          draft.tags.pop(); drawTags(); onComposerChange();
        }
      });
      tagEntry.addEventListener('blur', () => {
        if (tagEntry.value.trim()) { addTag(tagEntry.value); tagEntry.value = ''; onComposerChange(); }
      });

      form.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(); }
        if (e.key === 'Escape' && editingId) exitEditMode();
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (tagEntry.value.trim()) { addTag(tagEntry.value); tagEntry.value = ''; }
        const c = readComposer();
        if (!c.body.trim() && !c.title) return;

        const now = new Date();
        const pickDate = (keepTime) => {
          const [y, m, d] = (c.date || dayKey(now)).split('-').map(Number);
          const t = new Date(keepTime);
          return new Date(y, m - 1, d, t.getHours(), t.getMinutes(), t.getSeconds()).getTime();
        };

        if (editingId) {
          const i = entries.findIndex((x) => x.id === editingId);
          if (i > -1) {
            const old = entries[i];
            entries[i] = {
              ...old, ...c,
              body: c.body.trim(),
              createdAt: dayKey(old.createdAt) === c.date ? old.createdAt : pickDate(old.createdAt),
              updatedAt: Date.now(),
            };
            delete entries[i].date;
          }
          toast('Entry updated');
          exitEditMode();
        } else {
          const entry = normalize({ ...c, body: c.body.trim(), id: uid(), createdAt: pickDate(now) });
          delete entry.date;
          entries.push(entry);
          remove(DRAFT_KEY);
          fillComposer({});
          toast('Entry saved');
        }
        entries.sort((a, b) => b.createdAt - a.createdAt);
        save(JOURNAL_KEY, entries);
        drawInsights();
        drawList();
      });

      // ---------------- Insights ----------------
      function streak() {
        const days = new Set(entries.map((e) => dayKey(e.createdAt)));
        const d = new Date();
        if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
        let n = 0;
        while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
        return n;
      }

      function drawInsights() {
        const s = streak();
        const weekAgo = Date.now() - 7 * 864e5;
        const recent = entries.filter((e) => e.createdAt >= weekAgo && e.mood);
        const avg = recent.length ? recent.reduce((a, e) => a + e.mood, 0) / recent.length : null;
        const avgMood = avg ? moodOf(Math.round(avg)) : null;

        // Last 14 days of average mood
        const byDay = {};
        entries.forEach((e) => {
          if (!e.mood) return;
          (byDay[dayKey(e.createdAt)] ||= []).push(e.mood);
        });
        const bars = [];
        for (let i = 13; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i);
          const vals = byDay[dayKey(d)];
          const v = vals ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
          const m = v ? moodOf(Math.round(v)) : null;
          bars.push(`<div class="trend-bar" style="height:${v ? 20 + (v / 5) * 80 : 8}%;${m ? `background:${m.color}` : ''}"
            title="${fmtShort(d)}${m ? ` · ${m.label}` : ' · no mood logged'}"></div>`);
        }

        insightsEl.innerHTML = `
          <div class="card stat">
            <div class="stat-label">Streak</div>
            <div class="stat-value">${s}<small>day${s === 1 ? '' : 's'}</small></div>
          </div>
          <div class="card stat">
            <div class="stat-label">Entries</div>
            <div class="stat-value">${entries.length}</div>
          </div>
          <div class="card stat">
            <div class="stat-label">7-day mood</div>
            <div class="stat-value">${avgMood ? `${avgMood.emoji}<small>${avgMood.label}</small>` : '<small>No data yet</small>'}</div>
          </div>
          <div class="card trend">
            <div class="stat-label">Mood · last 14 days</div>
            <div class="trend-bars">${bars.join('')}</div>
            <div class="trend-foot"><span>2 weeks ago</span><span>Today</span></div>
          </div>
        `;
      }

      // ---------------- List ----------------
      function matches(e) {
        if (filters.mood && e.mood !== filters.mood) return false;
        if (filters.tag && !e.tags.includes(filters.tag)) return false;
        if (filters.q) {
          const hay = `${e.title} ${e.body} ${e.gratitude} ${e.tags.join(' ')}`.toLowerCase();
          if (!hay.includes(filters.q)) return false;
        }
        return true;
      }

      function entryCard(e) {
        const m = moodOf(e.mood);
        const el = document.createElement('article');
        el.className = 'card entry';
        if (m) el.style.setProperty('--c', m.color);
        const long = e.body.length > 320 || e.body.split('\n').length > 5;
        const energyBars = e.energy
          ? `<span>Energy<span class="energy-mini">${[1, 2, 3, 4, 5].map((n) =>
              `<i class="${n <= e.energy ? 'on' : ''}" style="height:${4 + n * 2}px"></i>`).join('')}</span></span>`
          : '';

        el.innerHTML = `
          <div class="entry-mood" aria-hidden="true">${m ? m.emoji : '📝'}</div>
          <div class="entry-main">
            <div class="entry-head">
              <h3>${esc(e.title || 'Untitled')}</h3>
              <div class="entry-actions">
                <button class="icon" data-act="edit" title="Edit entry" aria-label="Edit entry">✎</button>
                <button class="icon danger" data-act="delete" title="Delete entry" aria-label="Delete entry">✕</button>
              </div>
            </div>
            <div class="entry-meta">
              <span>${fmtShort(e.createdAt)} · ${fmtTime(e.createdAt)}</span>
              ${m ? `<span class="mood-name">${m.label}</span>` : ''}
              ${energyBars}
              ${e.updatedAt ? '<span>edited</span>' : ''}
            </div>
            ${e.body ? `<p class="entry-body ${long ? 'clamp' : ''}">${esc(e.body)}</p>` : ''}
            ${e.gratitude ? `<div class="entry-gratitude"><span>Grateful for</span>${esc(e.gratitude)}</div>` : ''}
            ${(e.tags.length || long) ? `
              <div class="entry-foot">
                <div class="entry-tags">${e.tags.map((t) => `<button class="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}</div>
                ${long ? '<button class="link" data-act="more">Show more</button>' : ''}
              </div>` : ''}
          </div>
        `;

        el.addEventListener('click', (ev) => {
          const act = ev.target.closest('[data-act]')?.dataset.act;
          const tagBtn = ev.target.closest('[data-tag]');
          if (act === 'edit') enterEditMode(e);
          else if (act === 'delete') deleteEntry(e);
          else if (act === 'more') {
            const body = el.querySelector('.entry-body');
            const open = body.classList.toggle('clamp');
            ev.target.textContent = open ? 'Show more' : 'Show less';
          } else if (tagBtn) {
            filters.tag = tagBtn.dataset.tag;
            drawList();
            $('.filterbar').scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
        return el;
      }

      function deleteEntry(e) {
        const idx = entries.findIndex((x) => x.id === e.id);
        if (idx < 0) return;
        const [removed] = entries.splice(idx, 1);
        if (editingId === e.id) exitEditMode();
        save(JOURNAL_KEY, entries);
        drawInsights(); drawList();
        toast('Entry deleted', () => {
          entries.splice(idx, 0, removed);
          save(JOURNAL_KEY, entries);
          drawInsights(); drawList();
        });
      }

      function drawList() {
        const shown = entries.filter(matches);
        const filtered = filters.q || filters.mood || filters.tag;

        root.querySelectorAll('[data-fmood]').forEach((b) => {
          b.classList.toggle('active', String(filters.mood ?? '') === b.dataset.fmood);
        });
        $('.active-tag').innerHTML = filters.tag
          ? `<span class="tag">#${esc(filters.tag)}<button type="button" aria-label="Clear tag filter">✕</button></span>` : '';
        $('.active-tag button')?.addEventListener('click', () => { filters.tag = null; drawList(); });
        $('.result-count').textContent = filtered ? `${shown.length} of ${entries.length}` : '';

        if (!entries.length) {
          listEl.innerHTML = `<div class="empty"><strong>Your journal is empty</strong>Write your first entry above. Even one sentence counts.</div>`;
          return;
        }
        if (!shown.length) {
          listEl.innerHTML = `<div class="empty"><strong>No matching entries</strong>Try a different search or clear the filters.</div>`;
          return;
        }

        const frag = document.createDocumentFragment();
        let month = '';
        shown.forEach((e) => {
          const m = fmtMonth(e.createdAt);
          if (m !== month) {
            month = m;
            const h = document.createElement('h2');
            h.className = 'month';
            h.textContent = m;
            frag.append(h);
          }
          frag.append(entryCard(e));
        });
        listEl.replaceChildren(frag);
      }

      $('.search input').addEventListener('input', debounce((e) => {
        filters.q = e.target.value.trim().toLowerCase();
        drawList();
      }, 150));

      root.querySelectorAll('[data-fmood]').forEach((b) => {
        b.onclick = () => { filters.mood = b.dataset.fmood ? Number(b.dataset.fmood) : null; drawList(); };
      });

      // ---------------- Init ----------------
      const savedDraft = load(DRAFT_KEY, null);
      fillComposer(savedDraft || {});
      if (savedDraft) updateMeta('Draft restored');
      drawInsights();
      drawList();
    }

    // =====================================================================
    // To-Do
    // =====================================================================
    const TODO_KEY = 'daybook.todos';
    const TODO_PREFS_KEY = 'daybook.todoPrefs';

    const PRIORITIES = [
      { v: 3, label: 'High',   color: 'var(--mood-1)' },
      { v: 2, label: 'Medium', color: 'var(--mood-2)' },
      { v: 1, label: 'Low',    color: 'var(--teal)' },
    ];
    const prioOf = (v) => PRIORITIES.find((p) => p.v === v);

    // Upgrade tasks saved by older versions ({id, text, done} only)
    const normTodo = (t) => ({
      id: t.id ?? uid(),
      text: t.text ?? '',
      done: !!t.done,
      priority: t.priority ?? 0,
      due: t.due ?? null,
      tags: Array.isArray(t.tags) ? t.tags : [],
      createdAt: t.createdAt ?? Date.now(),
      completedAt: t.completedAt ?? (t.done ? Date.now() : null),
    });

    function daysFromToday(key) {
      const [y, m, d] = key.split('-').map(Number);
      const t0 = new Date(); t0.setHours(0, 0, 0, 0);
      return Math.round((new Date(y, m - 1, d) - t0) / 864e5);
    }

    function dueInfo(due, done) {
      if (!due) return null;
      const diff = daysFromToday(due);
      const [y, m, d] = due.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const sameYear = dt.getFullYear() === new Date().getFullYear();
      const short = dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', ...(sameYear ? {} : { year: 'numeric' }) });
      let label, cls = '';
      if (diff < 0) {
        label = diff === -1 ? 'Yesterday' : short;
        if (!done) { label = `Overdue · ${label}`; cls = 'overdue'; }
      } else if (diff === 0) { label = 'Today'; if (!done) cls = 'today'; }
      else if (diff === 1) label = 'Tomorrow';
      else if (diff < 7) label = dt.toLocaleDateString(undefined, { weekday: 'long' });
      else label = short;
      return { diff, label, cls };
    }

    function ago(ts) {
      const s = (Date.now() - ts) / 1000;
      if (s < 60) return 'just now';
      if (s < 3600) return `${Math.floor(s / 60)}m ago`;
      if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
      if (s < 86400 * 7) return `${Math.floor(s / 86400)}d ago`;
      return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    // Priority / due date / tags controls, shared by the add form and the inline editor
    function taskOptions(init = {}) {
      const state = { priority: init.priority || 0, due: init.due || '', tags: [...(init.tags || [])] };
      const el = document.createElement('div');
      el.className = 'task-opts';
      el.innerHTML = `
        <div class="opt">
          <span class="opt-label">Priority</span>
          <div class="prio-picker" role="radiogroup" aria-label="Priority">
            ${PRIORITIES.map((p) => `
              <button type="button" class="prio-btn" data-p="${p.v}" style="--p:${p.color}" role="radio" aria-checked="false">
                <i class="dot"></i>${p.label}
              </button>`).join('')}
          </div>
        </div>
        <div class="opt">
          <span class="opt-label">Due</span>
          <input type="date" class="due-input" aria-label="Due date" />
          <button type="button" class="chip" data-q="0">Today</button>
          <button type="button" class="chip" data-q="1">Tomorrow</button>
        </div>
        <div class="tag-input">
          <span class="tag-list"></span>
          <input class="tag-entry" placeholder="Add tag…" maxlength="30" aria-label="Add tag" autocomplete="off" />
        </div>
      `;
      const dueInput = el.querySelector('.due-input');
      const tagEntry = el.querySelector('.tag-entry');
      const quickKey = (q) => { const d = new Date(); d.setDate(d.getDate() + q); return dayKey(d); };

      function sync() {
        el.querySelectorAll('.prio-btn').forEach((b) => {
          const on = Number(b.dataset.p) === state.priority;
          b.classList.toggle('selected', on);
          b.setAttribute('aria-checked', on);
        });
        dueInput.value = state.due;
        el.querySelectorAll('[data-q]').forEach((b) => b.classList.toggle('active', state.due === quickKey(Number(b.dataset.q))));
        el.querySelector('.tag-list').replaceChildren(...state.tags.map((t) => {
          const s = document.createElement('span');
          s.className = 'tag';
          s.innerHTML = `#${esc(t)}<button type="button" aria-label="Remove tag ${esc(t)}">✕</button>`;
          s.querySelector('button').onclick = () => { state.tags = state.tags.filter((x) => x !== t); sync(); };
          return s;
        }));
      }

      function commitTag() {
        const t = tagEntry.value.trim().replace(/^#/, '').replace(/\s+/g, '-').toLowerCase();
        tagEntry.value = '';
        if (t && !state.tags.includes(t)) state.tags.push(t);
        sync();
      }

      el.addEventListener('click', (e) => {
        const pb = e.target.closest('.prio-btn');
        if (pb) { const v = Number(pb.dataset.p); state.priority = state.priority === v ? 0 : v; sync(); return; }
        const qb = e.target.closest('[data-q]');
        if (qb) { const k = quickKey(Number(qb.dataset.q)); state.due = state.due === k ? '' : k; sync(); }
      });
      dueInput.addEventListener('change', () => { state.due = dueInput.value; sync(); });
      tagEntry.addEventListener('keydown', (e) => {
        if ((e.key === 'Enter' || e.key === ',') && tagEntry.value.trim()) { e.preventDefault(); e.stopPropagation(); commitTag(); }
        else if (e.key === 'Backspace' && !tagEntry.value && state.tags.length) { state.tags.pop(); sync(); }
      });
      tagEntry.addEventListener('blur', () => { if (tagEntry.value.trim()) commitTag(); });

      sync();
      return {
        el,
        get() { if (tagEntry.value.trim()) commitTag(); return { priority: state.priority, due: state.due || null, tags: [...state.tags] }; },
        reset() { state.priority = 0; state.due = ''; state.tags = []; tagEntry.value = ''; sync(); },
      };
    }

    function renderTodo(root) {
      let todos = load(TODO_KEY, []).map(normTodo);
      save(TODO_KEY, todos); // persist upgraded fields (e.g. completedAt) so they stay stable
      const prefs = { status: 'all', sort: 'smart', showDone: true, ...load(TODO_PREFS_KEY, {}) };
      const filters = { q: '', due: null, prio: null, tag: null };
      let editingId = null;

      root.innerHTML = `
        <section class="view">
          <div class="page-head">
            <h1>To-Do</h1>
            <p class="todo-summary"></p>
          </div>

          <div class="todo-stats"></div>

          <form class="card add-task" novalidate>
            <div class="add-main">
              <input name="text" placeholder="What needs doing?" autocomplete="off" aria-label="New task" maxlength="200" />
              <button type="submit">Add task</button>
            </div>
          </form>

          <div class="todo-filters">
            <div class="filter-top">
              <div class="seg status" role="tablist" aria-label="Show">
                <button data-status="active" role="tab">Active<span class="n"></span></button>
                <button data-status="completed" role="tab">Completed<span class="n"></span></button>
                <button data-status="all" role="tab">All<span class="n"></span></button>
              </div>
              <div class="search"><input type="search" placeholder="Search tasks…" aria-label="Search tasks" /></div>
              <select class="sort" aria-label="Sort tasks">
                <option value="smart">Sort: Smart</option>
                <option value="due">Sort: Due date</option>
                <option value="priority">Sort: Priority</option>
                <option value="newest">Sort: Newest</option>
              </select>
            </div>
            <div class="filter-row">
              <span class="group-label">Due</span>
              <button class="chip" data-due="overdue">Overdue<span class="n"></span></button>
              <button class="chip" data-due="today">Today<span class="n"></span></button>
              <button class="chip" data-due="week">This week<span class="n"></span></button>
              <button class="chip" data-due="none">No date</button>
              <span class="divider"></span>
              <span class="group-label">Priority</span>
              ${PRIORITIES.map((p) => `<button class="chip prio" data-prio="${p.v}" style="--p:${p.color}">${p.label}</button>`).join('')}
              <span class="active-tag"></span>
              <span class="spacer"></span>
              <button class="link clear-filters">Clear filters</button>
            </div>
          </div>

          <div class="progress">
            <div class="progress-top"><span class="progress-label"></span><span class="progress-pct"></span></div>
            <div class="progress-track"><div class="progress-fill"></div></div>
          </div>

          <ul class="task-list active-list"></ul>

          <div class="done-section">
            <div class="done-head">
              <button class="done-toggle" aria-expanded="true"><span class="caret">▾</span>Completed<span class="n"></span></button>
              <button class="link clear-done">Clear completed</button>
            </div>
            <ul class="task-list done-list"></ul>
          </div>
        </section>
      `;

      const $ = (s) => root.querySelector(s);
      const form = $('.add-task');
      const addOpts = taskOptions();
      form.append(addOpts.el);
      const activeList = $('.active-list');
      const doneList = $('.done-list');
      const doneSection = $('.done-section');

      const persist = () => { save(TODO_KEY, todos); draw(); };
      const savePrefs = () => save(TODO_PREFS_KEY, prefs);

      // ---------------- Filtering & sorting ----------------
      function dueBucket(t) {
        if (!t.due) return 'none';
        const d = daysFromToday(t.due);
        return d < 0 ? 'overdue' : d === 0 ? 'today' : d < 7 ? 'week' : 'later';
      }

      function matches(t, skip) {
        if (filters.q) {
          const hay = `${t.text} ${t.tags.join(' ')}`.toLowerCase();
          if (!hay.includes(filters.q)) return false;
        }
        if (filters.prio && t.priority !== filters.prio) return false;
        if (filters.tag && !t.tags.includes(filters.tag)) return false;
        if (filters.due && skip !== 'due') {
          if (filters.due === 'overdue' && t.done) return false; // finished tasks are never overdue
          const b = dueBucket(t);
          if (filters.due === 'week' ? !['today', 'week'].includes(b) : b !== filters.due) return false;
        }
        return true;
      }

      const dueSortVal = (t) => (t.due ? daysFromToday(t.due) : Infinity);
      const sorters = {
        smart: (a, b) => {
          const ua = dueSortVal(a) <= 0 ? 0 : 1, ub = dueSortVal(b) <= 0 ? 0 : 1; // overdue/today first
          return ua - ub || b.priority - a.priority || dueSortVal(a) - dueSortVal(b) || b.createdAt - a.createdAt;
        },
        due: (a, b) => dueSortVal(a) - dueSortVal(b) || b.priority - a.priority || b.createdAt - a.createdAt,
        priority: (a, b) => b.priority - a.priority || dueSortVal(a) - dueSortVal(b) || b.createdAt - a.createdAt,
        newest: (a, b) => b.createdAt - a.createdAt,
      };

      // ---------------- Actions ----------------
      function toggleDone(t) {
        const prev = { done: t.done, completedAt: t.completedAt };
        t.done = !t.done;
        t.completedAt = t.done ? Date.now() : null;
        persist();
        if (t.done) toast('Task completed', () => { Object.assign(t, prev); persist(); });
      }

      function deleteTask(t) {
        const idx = todos.indexOf(t);
        if (idx < 0) return;
        todos.splice(idx, 1);
        persist();
        toast('Task deleted', () => { todos.splice(idx, 0, t); persist(); });
      }

      function startEdit(li, t) {
        editingId = t.id;
        li.className = 'card task editing';
        li.style.removeProperty('--p');
        const opts = taskOptions(t);
        li.innerHTML = `
          <div class="task-editor">
            <input class="edit-text" maxlength="200" aria-label="Task text" />
            <div class="editor-actions">
              <button type="button" class="ghost" data-act="cancel">Cancel</button>
              <button type="button" data-act="save">Save</button>
            </div>
          </div>`;
        const editor = li.querySelector('.task-editor');
        const input = li.querySelector('.edit-text');
        input.value = t.text;
        editor.insertBefore(opts.el, editor.querySelector('.editor-actions'));

        const finish = (commit) => {
          editingId = null;
          if (commit) {
            const text = input.value.trim();
            if (text) Object.assign(t, { text, ...opts.get() });
            persist();
          } else draw();
        };
        li.querySelector('[data-act="save"]').onclick = () => finish(true);
        li.querySelector('[data-act="cancel"]').onclick = () => finish(false);
        li.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') finish(false);
          if (e.key === 'Enter' && e.target === input) finish(true);
        });
        input.focus();
        input.select();
      }

      // ---------------- Rendering ----------------
      function taskCard(t) {
        const li = document.createElement('li');
        const p = prioOf(t.priority);
        const due = dueInfo(t.due, t.done);
        li.className = 'card task' + (t.done ? ' done' : '');
        if (p && !t.done) li.style.setProperty('--p', p.color);

        const meta = [
          t.done ? `<span class="done-when">✓ Done ${ago(t.completedAt)}</span>` : '',
          p && !t.done ? `<span class="badge prio" style="--p:${p.color}">${p.label}</span>` : '',
          due ? `<span class="badge ${due.cls}">📅 ${esc(due.label)}</span>` : '',
          ...t.tags.map((tag) => `<button class="tag" data-tag="${esc(tag)}">#${esc(tag)}</button>`),
        ].filter(Boolean).join('');

        li.innerHTML = `
          <input type="checkbox" class="task-check" ${t.done ? 'checked' : ''}
            aria-label="${t.done ? 'Mark as not done' : 'Mark as done'}" />
          <div class="task-body">
            <div class="task-text"></div>
            ${meta ? `<div class="task-meta">${meta}</div>` : ''}
          </div>
          <div class="task-actions">
            <button class="icon" data-act="edit" title="Edit task" aria-label="Edit task">✎</button>
            <button class="icon danger" data-act="delete" title="Delete task" aria-label="Delete task">✕</button>
          </div>
        `;
        li.querySelector('.task-text').textContent = t.text;
        li.querySelector('.task-check').onchange = () => toggleDone(t);
        li.querySelector('.task-text').ondblclick = () => startEdit(li, t);
        li.addEventListener('click', (e) => {
          const act = e.target.closest('[data-act]')?.dataset.act;
          if (act === 'edit') startEdit(li, t);
          else if (act === 'delete') deleteTask(t);
          const tagBtn = e.target.closest('[data-tag]');
          if (tagBtn) { filters.tag = tagBtn.dataset.tag; draw(); }
        });
        return li;
      }

      function emptyState(html) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.innerHTML = html;
        return li;
      }

      function drawStats() {
        const active = todos.filter((t) => !t.done);
        const overdue = active.filter((t) => dueBucket(t) === 'overdue').length;
        const today = active.filter((t) => dueBucket(t) === 'today').length;
        const weekAgo = Date.now() - 7 * 864e5;
        const doneWeek = todos.filter((t) => t.done && t.completedAt >= weekAgo).length;

        const card = (key, label, value, cls, active) => `
          <button class="stat ${cls} ${active ? 'active' : ''}" data-stat="${key}">
            <div class="stat-label">${label}</div>
            <div class="stat-value">${value}</div>
          </button>`;
        $('.todo-stats').innerHTML =
          card('active', 'Active', active.length, '', prefs.status === 'active' && !filters.due) +
          card('today', 'Due today', today, today ? 'soon' : '', filters.due === 'today') +
          card('overdue', 'Overdue', overdue, overdue ? 'warn' : '', filters.due === 'overdue') +
          card('done', 'Done this week', doneWeek, doneWeek ? 'good' : '', prefs.status === 'completed');

        const parts = [];
        if (overdue) parts.push(`${overdue} overdue`);
        if (today) parts.push(`${today} due today`);
        $('.todo-summary').textContent = !todos.length ? 'Plan your day, one task at a time.'
          : !active.length ? 'Everything is done. Enjoy the quiet.'
          : `${active.length} active task${active.length === 1 ? '' : 's'}${parts.length ? ' · ' + parts.join(' · ') : ''}`;

        const done = todos.length - active.length;
        const pct = todos.length ? Math.round((done / todos.length) * 100) : 0;
        $('.progress').style.display = todos.length ? '' : 'none';
        $('.progress-label').textContent = `${done} of ${todos.length} done`;
        $('.progress-pct').textContent = `${pct}%`;
        $('.progress-fill').style.width = pct + '%';
      }

      function drawFilters(activeShown, doneShown) {
        root.querySelectorAll('[data-status]').forEach((b) => {
          b.classList.toggle('active', b.dataset.status === prefs.status);
          b.setAttribute('aria-selected', b.dataset.status === prefs.status);
          const n = { active: activeShown.length, completed: doneShown.length, all: activeShown.length + doneShown.length }[b.dataset.status];
          b.querySelector('.n').textContent = n;
        });
        // Due-chip counts consider every other filter, among active tasks
        const pool = todos.filter((t) => !t.done && matches(t, 'due'));
        root.querySelectorAll('[data-due]').forEach((b) => {
          b.classList.toggle('active', filters.due === b.dataset.due);
          const n = b.querySelector('.n');
          if (n) {
            const c = pool.filter((t) => {
              const k = dueBucket(t);
              return b.dataset.due === 'week' ? k === 'today' || k === 'week' : k === b.dataset.due;
            }).length;
            n.textContent = c || '';
          }
        });
        root.querySelectorAll('[data-prio]').forEach((b) => b.classList.toggle('active', filters.prio === Number(b.dataset.prio)));
        $('.active-tag').innerHTML = filters.tag
          ? `<span class="tag">#${esc(filters.tag)}<button type="button" aria-label="Clear tag filter">✕</button></span>` : '';
        $('.active-tag button')?.addEventListener('click', () => { filters.tag = null; draw(); });
        const anyFilter = filters.q || filters.due || filters.prio || filters.tag;
        $('.clear-filters').style.display = anyFilter ? '' : 'none';
        $('.sort').value = prefs.sort;
      }

      function draw() {
        if (editingId) return; // don't clobber an open editor
        const activeShown = todos.filter((t) => !t.done && matches(t)).sort(sorters[prefs.sort]);
        const doneShown = todos.filter((t) => t.done && matches(t)).sort((a, b) => b.completedAt - a.completedAt);
        const anyFilter = filters.q || filters.due || filters.prio || filters.tag;
        const totalDone = todos.filter((t) => t.done).length;

        drawStats();
        drawFilters(activeShown, doneShown);

        // Active list
        const showActive = prefs.status !== 'completed';
        activeList.style.display = showActive ? '' : 'none';
        if (showActive) {
          if (activeShown.length) activeList.replaceChildren(...activeShown.map(taskCard));
          else activeList.replaceChildren(emptyState(
            !todos.length ? '<strong>Nothing to do yet</strong>Add your first task above.'
            : anyFilter ? '<strong>No matching tasks</strong>Try another filter, or clear them.'
            : '<strong>All caught up 🎉</strong>Every task is done.'));
        }

        // Completed section
        const showDone = prefs.status !== 'active' && (doneShown.length || prefs.status === 'completed');
        doneSection.style.display = showDone ? '' : 'none';
        const collapsed = prefs.status === 'all' && !prefs.showDone;
        doneSection.classList.toggle('collapsed', collapsed);
        $('.done-toggle').setAttribute('aria-expanded', !collapsed);
        $('.done-toggle').style.pointerEvents = prefs.status === 'completed' ? 'none' : '';
        $('.done-toggle .caret').style.display = prefs.status === 'completed' ? 'none' : '';
        $('.done-toggle .n').textContent = doneShown.length;
        $('.clear-done').style.visibility = totalDone ? 'visible' : 'hidden';
        if (showDone) {
          doneList.replaceChildren(...(doneShown.length ? doneShown.map(taskCard)
            : [emptyState(anyFilter ? '<strong>No matching tasks</strong>Try another filter.' : '<strong>Nothing completed yet</strong>Check off a task and it lands here.')]));
        }
      }

      // ---------------- Events ----------------
      form.addEventListener('submit', (ev) => {
        ev.preventDefault();
        const input = form.elements.text;
        const text = input.value.trim();
        if (!text) { input.focus(); return; }
        todos.unshift(normTodo({ id: uid(), text, done: false, createdAt: Date.now(), ...addOpts.get() }));
        input.value = '';
        addOpts.reset();
        if (prefs.status === 'completed') { prefs.status = 'all'; savePrefs(); }
        persist();
        input.focus();
      });

      root.querySelectorAll('[data-status]').forEach((b) => {
        b.onclick = () => { prefs.status = b.dataset.status; savePrefs(); draw(); };
      });
      root.querySelectorAll('[data-due]').forEach((b) => {
        b.onclick = () => { filters.due = filters.due === b.dataset.due ? null : b.dataset.due; draw(); };
      });
      root.querySelectorAll('[data-prio]').forEach((b) => {
        b.onclick = () => { const v = Number(b.dataset.prio); filters.prio = filters.prio === v ? null : v; draw(); };
      });
      $('.sort').onchange = (e) => { prefs.sort = e.target.value; savePrefs(); draw(); };
      $('.search input').addEventListener('input', debounce((e) => { filters.q = e.target.value.trim().toLowerCase(); draw(); }, 150));
      $('.clear-filters').onclick = () => {
        Object.assign(filters, { q: '', due: null, prio: null, tag: null });
        $('.search input').value = '';
        draw();
      };
      $('.done-toggle').onclick = () => { prefs.showDone = !prefs.showDone; savePrefs(); draw(); };
      $('.clear-done').onclick = () => {
        const before = [...todos];
        const n = todos.filter((t) => t.done).length;
        todos = todos.filter((t) => !t.done);
        persist();
        toast(`Cleared ${n} completed task${n === 1 ? '' : 's'}`, () => { todos = before; persist(); });
      };

      // Stat cards act as shortcuts
      $('.todo-stats').addEventListener('click', (e) => {
        const key = e.target.closest('[data-stat]')?.dataset.stat;
        if (!key) return;
        if (key === 'active') { prefs.status = 'active'; filters.due = null; }
        else if (key === 'done') { prefs.status = prefs.status === 'completed' ? 'all' : 'completed'; filters.due = null; }
        else { filters.due = filters.due === key ? null : key; if (filters.due) prefs.status = 'active'; }
        savePrefs();
        draw();
      });

      draw();
    }

    // =====================================================================
    // Router
    // =====================================================================
    const routes = { journal: renderJournal, todo: renderTodo };
    const app = document.getElementById('app');

    function router() {
      const name = location.hash.replace('#/', '') || 'journal';
      const render = routes[name] ?? routes.journal;
      document.querySelectorAll('.nav a').forEach((a) => {
        const on = a.dataset.route === name;
        a.classList.toggle('active', on);
        a.toggleAttribute('aria-current', on);
      });
      hideToast();
      app.replaceChildren();
      render(app);
      window.scrollTo(0, 0);
    }

    window.addEventListener('hashchange', router);
    router();
  })();
  </script>
</body>
</html>
