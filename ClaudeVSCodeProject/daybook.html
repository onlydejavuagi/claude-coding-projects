<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daybook</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f3460'/><path d='M10 9h12M10 16h12M10 23h7' stroke='%23a8dadc' stroke-width='3' stroke-linecap='round'/></svg>" />
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --card: #0f3460;
      --accent: #e94560;
      --teal: #a8dadc;
      --text: #e8e8f0;
      --muted: #8b93b0;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      line-height: 1.5;
    }

    /* ---- Top bar / navigation ---- */
    .topbar {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid #ffffff10;
    }
    .brand { font-weight: 600; letter-spacing: 0.5px; color: var(--teal); }
    .nav { display: flex; gap: 4px; }
    .nav a {
      padding: 6px 14px;
      border-radius: 999px;
      color: var(--muted);
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .nav a:hover { color: var(--text); }
    .nav a.active { background: var(--card); color: var(--text); }

    /* ---- Layout ---- */
    .view {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 16px 64px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 { font-size: 1.6rem; font-weight: 600; }

    .card {
      background: var(--surface);
      border: 1px solid #ffffff0d;
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .empty { color: var(--muted); text-align: center; padding: 24px 0; }

    /* ---- Form controls ---- */
    input:not([type]), textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid #ffffff1a;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      resize: vertical;
    }
    input:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: -1px; }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font: inherit;
      cursor: pointer;
      transition: filter 0.15s;
    }
    button:hover { filter: brightness(1.1); }

    button.icon { background: transparent; color: var(--muted); padding: 4px 8px; }
    button.icon:hover { color: var(--accent); }

    /* ---- Journal ---- */
    .composer { display: flex; flex-direction: column; gap: 10px; }
    .row-end { display: flex; justify-content: flex-end; }
    .entry-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .entry h3 { font-size: 1.05rem; font-weight: 600; }
    .entry time { font-size: 0.8rem; color: var(--teal); }
    .entry p { margin-top: 8px; white-space: pre-wrap; color: #d0d4e4; }

    /* ---- To-Do ---- */
    .add-row { display: flex; gap: 10px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; }
    .filters { display: flex; gap: 6px; }
    .chip {
      background: transparent;
      color: var(--muted);
      border: 1px solid #ffffff1a;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.85rem;
    }
    .chip.active { background: var(--card); color: var(--text); border-color: transparent; }
    .count { font-size: 0.85rem; color: var(--muted); }

    .todo { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
    .todo label { display: flex; align-items: center; gap: 12px; flex: 1; cursor: pointer; }
    .todo input[type='checkbox'] { width: 18px; height: 18px; accent-color: var(--accent); }
    .todo.done span { color: var(--muted); text-decoration: line-through; }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">Daybook</span>
    <nav class="nav">
      <a href="#/journal" data-route="journal">Journal</a>
      <a href="#/todo" data-route="todo">To-Do</a>
    </nav>
  </header>
  <main id="app"></main>

  <script>
  (() => {
    // ---------- Storage (localStorage, with in-memory fallback) ----------
    const memory = {};

    function load(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return memory[key] ?? fallback;
      }
    }

    function save(key, value) {
      memory[key] = value;
      try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* memory only */ }
    }

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    // ---------- Journal view ----------
    const JOURNAL_KEY = 'daybook.journal';

    const fmtDate = (ts) =>
      new Date(ts).toLocaleDateString(undefined, {
        weekday: 'short', month: 'short', day: 'numeric', year: 'numeric',
      });

    function renderJournal(root) {
      let entries = load(JOURNAL_KEY, []);

      root.innerHTML = `
        <section class="view">
          <h1>Journal</h1>
          <form class="card composer">
            <input name="title" placeholder="Title (optional)" autocomplete="off" />
            <textarea name="body" rows="5" placeholder="What's on your mind today?" required></textarea>
            <div class="row-end"><button type="submit">Save entry</button></div>
          </form>
          <ul class="entries"></ul>
        </section>
      `;

      const form = root.querySelector('form');
      const list = root.querySelector('.entries');

      function draw() {
        if (!entries.length) {
          list.innerHTML = `<li class="empty">No entries yet. Write your first one above.</li>`;
          return;
        }
        list.replaceChildren(...entries.map((e) => {
          const li = document.createElement('li');
          li.className = 'card entry';
          li.innerHTML = `
            <div class="entry-head">
              <div><h3></h3><time>${fmtDate(e.createdAt)}</time></div>
              <button class="icon" title="Delete entry" aria-label="Delete entry">✕</button>
            </div>
            <p></p>
          `;
          li.querySelector('h3').textContent = e.title || 'Untitled';
          li.querySelector('p').textContent = e.body;
          li.querySelector('button').onclick = () => {
            entries = entries.filter((x) => x.id !== e.id);
            save(JOURNAL_KEY, entries);
            draw();
          };
          return li;
        }));
      }

      form.onsubmit = (ev) => {
        ev.preventDefault();
        const data = new FormData(form);
        const body = data.get('body').trim();
        if (!body) return;
        entries.unshift({ id: uid(), title: data.get('title').trim(), body, createdAt: Date.now() });
        save(JOURNAL_KEY, entries);
        form.reset();
        draw();
      };

      draw();
    }

    // ---------- To-Do view ----------
    const TODO_KEY = 'daybook.todos';

    function renderTodo(root) {
      let todos = load(TODO_KEY, []);
      let filter = 'all';

      root.innerHTML = `
        <section class="view">
          <h1>To-Do</h1>
          <form class="card add-row">
            <input name="text" placeholder="Add a task…" autocomplete="off" required />
            <button type="submit">Add</button>
          </form>
          <div class="toolbar">
            <div class="filters">
              <button data-f="all" class="chip active">All</button>
              <button data-f="open" class="chip">Open</button>
              <button data-f="done" class="chip">Done</button>
            </div>
            <span class="count"></span>
          </div>
          <ul class="todos"></ul>
        </section>
      `;

      const form = root.querySelector('form');
      const list = root.querySelector('.todos');
      const count = root.querySelector('.count');

      const persist = () => { save(TODO_KEY, todos); draw(); };

      function draw() {
        count.textContent = `${todos.filter((t) => !t.done).length} open`;

        const shown = todos.filter((t) =>
          filter === 'all' ? true : filter === 'done' ? t.done : !t.done
        );

        if (!shown.length) {
          list.innerHTML = `<li class="empty">${todos.length ? 'Nothing here.' : 'No tasks yet.'}</li>`;
          return;
        }

        list.replaceChildren(...shown.map((t) => {
          const li = document.createElement('li');
          li.className = 'card todo' + (t.done ? ' done' : '');
          li.innerHTML = `
            <label><input type="checkbox" ${t.done ? 'checked' : ''} /><span></span></label>
            <button class="icon" title="Delete task" aria-label="Delete task">✕</button>
          `;
          li.querySelector('span').textContent = t.text;
          li.querySelector('input').onchange = () => { t.done = !t.done; persist(); };
          li.querySelector('button').onclick = () => {
            todos = todos.filter((x) => x.id !== t.id);
            persist();
          };
          return li;
        }));
      }

      form.onsubmit = (ev) => {
        ev.preventDefault();
        const text = new FormData(form).get('text').trim();
        if (!text) return;
        todos.unshift({ id: uid(), text, done: false });
        form.reset();
        persist();
      };

      root.querySelectorAll('.chip').forEach((b) => {
        b.onclick = () => {
          filter = b.dataset.f;
          root.querySelectorAll('.chip').forEach((c) => c.classList.toggle('active', c === b));
          draw();
        };
      });

      draw();
    }

    // ---------- Router ----------
    const routes = { journal: renderJournal, todo: renderTodo };
    const app = document.getElementById('app');

    function router() {
      const name = location.hash.replace('#/', '') || 'journal';
      const render = routes[name] ?? routes.journal;
      document.querySelectorAll('.nav a').forEach((a) => {
        a.classList.toggle('active', a.dataset.route === name);
      });
      app.replaceChildren();
      render(app);
    }

    window.addEventListener('hashchange', router);
    router();
  })();
  </script>
</body>
</html>
