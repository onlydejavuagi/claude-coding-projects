<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily News Curator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1a1a2e;
      --surface:  #16213e;
      --card:     #0f3460;
      --accent:   #e94560;
      --blue:     #457b9d;
      --teal:     #a8dadc;
      --text:     #eee;
      --muted:    #888;
      --border:   #1e3a5f;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 1.3rem;
      color: var(--accent);
      letter-spacing: 1px;
      white-space: nowrap;
    }
    header .date {
      color: var(--teal);
      font-size: 0.85rem;
    }
    header .spacer { flex: 1; }
    #refreshBtn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    #refreshBtn:hover { background: var(--accent); border-color: var(--accent); }
    #refreshBtn.loading { opacity: 0.6; pointer-events: none; }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Main layout ── */
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 55px);
    }

    /* ── Panel shared ── */
    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .panel:last-child { border-right: none; }
    .panel-header {
      background: var(--surface);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .panel-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 4px; }
    .tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
    }
    .tab.active { background: var(--card); color: var(--teal); border-color: var(--border); }
    .tab:hover:not(.active) { color: var(--text); }

    /* ── Feed ── */
    #feedList {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #feedList::-webkit-scrollbar { width: 5px; }
    #feedList::-webkit-scrollbar-track { background: transparent; }
    #feedList::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .feed-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      transition: border-color 0.15s;
    }
    .feed-card:hover { border-color: var(--blue); }
    .feed-card.added { opacity: 0.45; }
    .feed-info { flex: 1; min-width: 0; }
    .feed-headline {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 4px;
      color: var(--text);
      cursor: pointer;
    }
    .feed-headline:hover { color: var(--teal); }
    .feed-meta {
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .feed-cat {
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cat-stock { background: #1a3a1a; color: #6fcf97; }
    .cat-tech  { background: #1a1a3a; color: var(--teal); }
    .feed-excerpt { font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
    .add-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--teal);
      border-radius: 6px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      margin-top: 2px;
    }
    .add-btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; }
    .add-btn:disabled { opacity: 0.3; cursor: default; }

    .feed-empty, .feed-loading {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      font-size: 0.85rem;
    }
    .source-error {
      font-size: 0.72rem;
      color: #c0392b;
      background: #1a0a0a;
      border: 1px solid #3a1a1a;
      border-radius: 6px;
      padding: 6px 10px;
    }

    /* ── Episode panel ── */
    #episodePanel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }
    #episodeList {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }
    #episodeList::-webkit-scrollbar { width: 5px; }
    #episodeList::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .episode-empty {
      text-align: center;
      color: var(--muted);
      padding: 30px 20px;
      font-size: 0.85rem;
    }
    .ep-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .ep-num {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      min-width: 18px;
      margin-top: 2px;
    }
    .ep-title {
      flex: 1;
      font-size: 0.82rem;
      line-height: 1.35;
      cursor: pointer;
    }
    .ep-title:hover { color: var(--teal); }
    .ep-source { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .ep-controls { display: flex; gap: 2px; flex-shrink: 0; }
    .ep-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      width: 22px;
      height: 22px;
      cursor: pointer;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .ep-btn:hover { color: var(--text); border-color: var(--blue); }
    .ep-btn.remove:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Episode counter ── */
    .ep-count {
      font-size: 0.72rem;
      color: var(--muted);
      margin-left: auto;
    }
    .ep-count span { color: var(--teal); font-weight: 700; }

    /* ── Export section ── */
    #exportSection {
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      height: 280px;
      flex-shrink: 0;
    }
    .export-header {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .export-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
    }
    #exportText {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: none;
      resize: none;
      padding: 10px 12px;
      font-size: 0.78rem;
      font-family: 'Courier New', monospace;
      line-height: 1.5;
      outline: none;
    }
    .export-footer {
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }
    #copyBtn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: opacity 0.2s;
    }
    #copyBtn:hover { opacity: 0.85; }
    #copyBtn.copied { background: #27ae60; }

    /* ── TTS controls ── */
    #ttsControls { display: flex; align-items: center; gap: 6px; flex: 1; }
    .tts-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tts-btn:hover:not(:disabled) { border-color: var(--teal); color: var(--teal); }
    .tts-btn:disabled { opacity: 0.3; cursor: default; }
    #playBtn.speaking {
      border-color: var(--teal);
      color: var(--teal);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(168,218,220,0.4); }
      50%       { box-shadow: 0 0 0 5px rgba(168,218,220,0); }
    }
    #ttsUnsupported { font-size: 0.72rem; color: var(--muted); }

    /* ── Session notice ── */
    #sessionNotice {
      background: #1a2a1a;
      border: 1px solid #2a4a2a;
      color: #6fcf97;
      font-size: 0.72rem;
      padding: 4px 12px;
      text-align: center;
      display: none;
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; height: auto; overflow: visible; }
      .panel { height: 50vh; }
      #episodePanel { height: auto; }
      #exportSection { height: 240px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Daily News Curator</h1>
  <span class="date" id="headerDate"></span>
  <div class="spacer"></div>
  <button id="refreshBtn">&#8635; Refresh</button>
</header>

<div id="sessionNotice">Restored from last session</div>

<main>
  <!-- LEFT: News Feed -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">News Feed</span>
      <div class="tabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="stock">Stock</button>
        <button class="tab" data-filter="tech">Tech</button>
      </div>
    </div>
    <div id="feedList"><div class="feed-loading">Loading news feeds&#8230;</div></div>
  </div>

  <!-- RIGHT: Episode + Export -->
  <div class="panel" style="border-right:none; display:flex; flex-direction:column;">
    <div id="episodePanel">
      <div class="panel-header">
        <span class="panel-title">Today's Episode</span>
        <div class="ep-count"><span id="epCountNum">0</span>/10 stories</div>
      </div>
      <div id="episodeList">
        <div class="episode-empty">Click + on a story to add it here</div>
      </div>
    </div>

    <div id="exportSection">
      <div class="export-header">
        <span class="export-title">Export</span>
        <div class="tabs">
          <button class="tab active" data-export="script">Script</button>
          <button class="tab" data-export="bullets">Bullet List</button>
        </div>
      </div>
      <textarea id="exportText" readonly placeholder="Add stories to generate your export..."></textarea>
      <div class="export-footer">
        <div id="ttsControls">
          <button class="tts-btn" id="playBtn" title="Read aloud">&#9654; Play</button>
          <button class="tts-btn" id="pauseBtn" title="Pause / Resume" disabled>&#9646;&#9646; Pause</button>
          <button class="tts-btn" id="stopBtn" title="Stop" disabled>&#9632; Stop</button>
          <span id="ttsUnsupported" style="display:none">TTS not supported in this browser</span>
        </div>
        <button id="copyBtn">&#128203; Copy to Clipboard</button>
      </div>
    </div>
  </div>
</main>

<script>
  // ── State ──
  const STORAGE_KEY = 'news-curator-episode';
  let allItems = [];
  let episode = [];
  let activeFilter = 'all';
  let activeExport = 'script';

  // ── RSS Sources ──
  const SOURCES = [
    { url: 'https://www.cnbc.com/id/20910258/device/rss/rss.html', name: 'CNBC Markets', cat: 'stock' },
    { url: 'https://feeds.reuters.com/reuters/businessNews',        name: 'Reuters Business', cat: 'stock' },
    { url: 'https://www.marketwatch.com/rss/topstories',            name: 'MarketWatch', cat: 'stock' },
    { url: 'https://techcrunch.com/feed/',                          name: 'TechCrunch', cat: 'tech' },
    { url: 'https://www.theverge.com/rss/index.xml',                name: 'The Verge', cat: 'tech' },
    { url: 'https://feeds.arstechnica.com/arstechnica/index',       name: 'Ars Technica', cat: 'tech' },
    { url: 'https://news.ycombinator.com/rss',                      name: 'Hacker News', cat: 'tech' },
  ];

  const CORS_PROXY = 'https://api.allorigins.win/get?url=';

  // ── Helpers ──
  function relativeTime(dateStr) {
    if (!dateStr) return '';
    const diff = Date.now() - new Date(dateStr).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1)  return 'just now';
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    return `${Math.floor(h / 24)}d ago`;
  }

  function stripHtml(str) {
    if (!str) return '';
    return str.replace(/<[^>]*>/g, '').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ').trim();
  }

  function truncate(str, n) {
    if (!str) return '';
    const s = stripHtml(str);
    return s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + '…' : s;
  }

  function uid(item) {
    return (item.link || item.title || '').slice(0, 80);
  }

  function todayStr() {
    return new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  }

  // ── Fetch ──
  async function fetchSource(src) {
    const res = await fetch(CORS_PROXY + encodeURIComponent(src.url));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.contents) throw new Error('Empty response');

    const parser = new DOMParser();
    const xml = parser.parseFromString(data.contents, 'text/xml');

    // Support both RSS 2.0 (<item>) and Atom (<entry>)
    const nodes = [...xml.querySelectorAll('item'), ...xml.querySelectorAll('entry')];

    return nodes.slice(0, 15).map(node => {
      const text = tag => { const el = node.querySelector(tag); return el ? el.textContent.trim() : ''; };
      const attr = (tag, a) => { const el = node.querySelector(tag); return el ? (el.getAttribute(a) || '') : ''; };

      const title   = stripHtml(text('title'));
      const link    = text('link') || attr('link', 'href') || text('guid') || '#';
      const desc    = text('description') || text('summary') || text('content');
      const pubDate = text('pubDate') || text('published') || text('updated') || '';

      return {
        id:      (link + title).slice(0, 80),
        title,
        link:    link.startsWith('http') ? link : '#',
        source:  src.name,
        cat:     src.cat,
        pubDate,
        excerpt: truncate(desc, 120),
      };
    }).filter(item => item.title);
  }

  async function fetchAllFeeds() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('loading');
    btn.innerHTML = '<span class="spin">&#8635;</span> Loading…';

    document.getElementById('feedList').innerHTML = '<div class="feed-loading">Fetching news&#8230;</div>';

    const results = await Promise.allSettled(SOURCES.map(fetchSource));
    let items = [];
    const errors = [];

    results.forEach((r, i) => {
      if (r.status === 'fulfilled') items = items.concat(r.value);
      else errors.push(SOURCES[i].name);
    });

    // de-duplicate by id
    const seen = new Set();
    items = items.filter(it => { if (seen.has(it.id)) return false; seen.add(it.id); return true; });

    // sort newest first
    items.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
    allItems = items;

    renderFeed();
    syncAddButtons();

    btn.classList.remove('loading');
    btn.innerHTML = '&#8635; Refresh';

    if (errors.length) {
      const el = document.createElement('div');
      el.className = 'source-error';
      el.textContent = 'Could not load: ' + errors.join(', ');
      document.getElementById('feedList').prepend(el);
    }
  }

  // ── Render Feed ──
  function renderFeed() {
    const list = document.getElementById('feedList');
    const items = activeFilter === 'all' ? allItems : allItems.filter(it => it.cat === activeFilter);

    if (!items.length) {
      list.innerHTML = '<div class="feed-empty">No stories found.</div>';
      return;
    }

    list.innerHTML = '';
    const epIds = new Set(episode.map(e => e.id));

    items.forEach(item => {
      const added = epIds.has(item.id);
      const full = episode.length >= 10;
      const card = document.createElement('div');
      card.className = 'feed-card' + (added ? ' added' : '');
      card.dataset.id = item.id;
      card.innerHTML = `
        <div class="feed-info">
          <div class="feed-headline" title="${item.title}">${item.title}</div>
          <div class="feed-meta">
            <span class="feed-cat cat-${item.cat}">${item.cat}</span>
            <span>${item.source}</span>
            <span>·</span>
            <span>${relativeTime(item.pubDate)}</span>
          </div>
          ${item.excerpt ? `<div class="feed-excerpt">${item.excerpt}</div>` : ''}
        </div>
        <button class="add-btn" title="Add to episode" ${added || full ? 'disabled' : ''} data-id="${item.id}">+</button>
      `;
      card.querySelector('.feed-headline').onclick = () => window.open(item.link, '_blank');
      card.querySelector('.add-btn').onclick = () => addToEpisode(item);
      list.appendChild(card);
    });
  }

  function syncAddButtons() {
    const epIds = new Set(episode.map(e => e.id));
    const full = episode.length >= 10;
    document.querySelectorAll('.feed-card').forEach(card => {
      const id = card.dataset.id;
      const added = epIds.has(id);
      card.classList.toggle('added', added);
      const btn = card.querySelector('.add-btn');
      if (btn) btn.disabled = added || full;
    });
  }

  // ── Episode ──
  function addToEpisode(item) {
    if (episode.length >= 10 || episode.find(e => e.id === item.id)) return;
    episode.push(item);
    saveEpisode();
    renderEpisode();
    syncAddButtons();
    updateExport();
  }

  function removeFromEpisode(id) {
    episode = episode.filter(e => e.id !== id);
    saveEpisode();
    renderEpisode();
    syncAddButtons();
    updateExport();
  }

  function moveStory(id, dir) {
    const idx = episode.findIndex(e => e.id === id);
    if (idx < 0) return;
    const target = idx + dir;
    if (target < 0 || target >= episode.length) return;
    [episode[idx], episode[target]] = [episode[target], episode[idx]];
    saveEpisode();
    renderEpisode();
    updateExport();
  }

  function renderEpisode() {
    const list = document.getElementById('episodeList');
    document.getElementById('epCountNum').textContent = episode.length;

    if (!episode.length) {
      list.innerHTML = '<div class="episode-empty">Click + on a story to add it here</div>';
      return;
    }

    list.innerHTML = '';
    episode.forEach((item, i) => {
      const el = document.createElement('div');
      el.className = 'ep-item';
      el.innerHTML = `
        <span class="ep-num">${i + 1}.</span>
        <div style="flex:1;min-width:0;">
          <div class="ep-title">${item.title}</div>
          <div class="ep-source">${item.source} · ${relativeTime(item.pubDate)}</div>
        </div>
        <div class="ep-controls">
          <button class="ep-btn" title="Move up" ${i === 0 ? 'disabled' : ''}>&#9650;</button>
          <button class="ep-btn" title="Move down" ${i === episode.length - 1 ? 'disabled' : ''}>&#9660;</button>
          <button class="ep-btn remove" title="Remove">&#10005;</button>
        </div>
      `;
      el.querySelector('.ep-title').onclick = () => window.open(item.link, '_blank');
      const [upBtn, downBtn, removeBtn] = el.querySelectorAll('.ep-btn');
      upBtn.onclick = () => moveStory(item.id, -1);
      downBtn.onclick = () => moveStory(item.id, 1);
      removeBtn.onclick = () => removeFromEpisode(item.id);
      list.appendChild(el);
    });
  }

  // ── Export ──
  function generateScript() {
    if (!episode.length) return '';
    const date = todayStr();
    let out = `Welcome to your daily briefing for ${date}.\n`;
    out += `Here are the top ${episode.length} stories in stocks and tech today.\n\n`;
    out += '─'.repeat(50) + '\n\n';
    episode.forEach((item, i) => {
      out += `Story ${i + 1}: ${item.title}\n`;
      if (item.excerpt) out += `${item.excerpt}\n`;
      out += `Source: ${item.source}  |  ${item.link}\n\n`;
    });
    out += '─'.repeat(50) + '\n\n';
    out += `That's all for today. Stay informed and we'll see you tomorrow.`;
    return out;
  }

  function generateBulletList() {
    if (!episode.length) return '';
    const date = todayStr();
    let out = `Top Stories — ${date}\n\n`;
    episode.forEach((item, i) => {
      out += `${i + 1}. ${item.title} (${item.source})\n`;
      out += `   ${item.link}\n\n`;
    });
    return out.trim();
  }

  function updateExport() {
    stopTTS();
    const text = activeExport === 'script' ? generateScript() : generateBulletList();
    document.getElementById('exportText').value = text;
    const copyBtn = document.getElementById('copyBtn');
    copyBtn.classList.remove('copied');
    copyBtn.textContent = '\u{1F4CB} Copy to Clipboard';
  }

  // ── Persistence ──
  function saveEpisode() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(episode));
  }

  function loadEpisode() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length) {
          episode = parsed;
          document.getElementById('sessionNotice').style.display = 'block';
          setTimeout(() => document.getElementById('sessionNotice').style.display = 'none', 4000);
        }
      }
    } catch {}
  }

  // ── Events ──
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('en-US', {
    weekday:'short', year:'numeric', month:'short', day:'numeric'
  });

  document.querySelectorAll('.tabs .tab[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab[data-filter]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderFeed();
      syncAddButtons();
    });
  });

  document.querySelectorAll('.tabs .tab[data-export]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab[data-export]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeExport = btn.dataset.export;
      updateExport();
    });
  });

  document.getElementById('refreshBtn').addEventListener('click', fetchAllFeeds);

  document.getElementById('copyBtn').addEventListener('click', () => {
    const text = document.getElementById('exportText').value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.classList.add('copied');
      btn.textContent = '✓ Copied!';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.textContent = '\u{1F4CB} Copy to Clipboard';
      }, 2500);
    });
  });

  // ── Text-to-Speech ──
  let ttsSpeaking = false;
  let ttsPaused   = false;

  const playBtn  = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn  = document.getElementById('stopBtn');

  if (!window.speechSynthesis) {
    document.getElementById('ttsControls').style.display = 'none';
    document.getElementById('ttsUnsupported').style.display = 'inline';
  }

  function syncTTSButtons() {
    playBtn.disabled  = ttsSpeaking && !ttsPaused;
    pauseBtn.disabled = !ttsSpeaking;
    stopBtn.disabled  = !ttsSpeaking;
    pauseBtn.innerHTML = ttsPaused ? '&#9654; Resume' : '&#9646;&#9646; Pause';
    playBtn.classList.toggle('speaking', ttsSpeaking && !ttsPaused);
  }

  function stopTTS() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    ttsSpeaking = false;
    ttsPaused   = false;
    syncTTSButtons();
  }

  function playTTS() {
    const text = document.getElementById('exportText').value.trim();
    if (!text || !window.speechSynthesis) return;
    stopTTS();
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate  = 0.95;
    utt.pitch = 1;
    utt.onstart = () => { ttsSpeaking = true; ttsPaused = false; syncTTSButtons(); };
    utt.onend   = () => { ttsSpeaking = false; ttsPaused = false; syncTTSButtons(); };
    utt.onerror = () => { ttsSpeaking = false; ttsPaused = false; syncTTSButtons(); };
    window.speechSynthesis.speak(utt);
  }

  function togglePause() {
    if (!ttsSpeaking) return;
    if (ttsPaused) {
      window.speechSynthesis.resume();
      ttsPaused = false;
    } else {
      window.speechSynthesis.pause();
      ttsPaused = true;
    }
    syncTTSButtons();
  }

  playBtn.addEventListener('click',  playTTS);
  pauseBtn.addEventListener('click', togglePause);
  stopBtn.addEventListener('click',  stopTTS);

  // ── Init ──
  loadEpisode();
  renderEpisode();
  updateExport();
  fetchAllFeeds();
</script>
</body>
</html>
